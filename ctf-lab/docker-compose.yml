name: ctf-lab-course
services:
  http-basics:
    build: ./modules/http-basics
    container_name: ctf-http-basics
    ports:
      - "127.0.0.1:8001:80"   # 2026-09-08 修正：原 8080 与本机 Burp 冲突，实际容器早已跑在 8001
    restart: unless-stopped
  cmd-injection:
    build: ./modules/cmd-injection
    container_name: ctf-cmd-injection
    ports:
      - "127.0.0.1:8082:80"
    restart: unless-stopped
  sql-injection:
    build: ./modules/sql-injection
    container_name: ctf-sql-injection
    depends_on:
      - sql-injection-db
    ports:
      - "127.0.0.1:8083:80"
    restart: unless-stopped
  sql-injection-db:
    image: mysql:5.7
    container_name: ctf-sql-injection-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: ctf
      MYSQL_USER: ctf
      MYSQL_PASSWORD: ctfpass
    volumes:
      - ./modules/sql-injection/db:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
  xss:
    build: ./modules/xss
    container_name: ctf-xss
    ports:
      - "127.0.0.1:8084:80"
    restart: unless-stopped
  upload-lfi:
    build: ./modules/upload-lfi
    container_name: ctf-upload-lfi
    ports:
      - "127.0.0.1:8085:80"
    restart: unless-stopped
  upload-lfi-adv:
    build: ./modules/upload-lfi-adv
    container_name: ctf-upload-lfi-adv
    ports:
      - "127.0.0.1:8086:80"
    restart: unless-stopped
